notification_email: chey.jobbot@gmail.com
user_name: Cheyguy

search:
  results_per_query: 40
  pages: 2
  max_queries_per_country: 18
  api_retries: 3
  retry_backoff_seconds: 2
  max_retry_delay_seconds: 30
  max_consecutive_failed_pages: 4
  max_age_days: 30
  # Keep adjacent and transferable matches in the digest; the email remains capped at 10.
  minimum_fit_score: 3.0
  max_email_results: 10

# Only explicit minimums at or above these ceilings are screened out.
# Preferred/desirable experience is not treated as a hard requirement.
seniority_filters:
  screen_out_minimums_at_or_above:
    overall_years: 10
  exclude_explicit_pure_b2b_minimum: true
  exclude_explicit_pure_b2b_requirement: true
  pure_b2b_requirement_signals:
    - must have
    - is a must
    - required
    - requires
    - mandatory
    - essential
    - minimum
    - at least
    - requis
    - exige
    - obligatoire
    - indispensable
    - au moins
  preferred_signals:
    - preferred
    - desirable
    - ideally
    - nice to have
    - would be a plus
    - an advantage
    - souhaité
    - souhaitable
    - apprécié
    - un atout

# Choose balanced, cv_evidence, or adjacent_discovery as active_profile.
# Profiles are relative weights; the app normalizes every result to /10.
scoring:
  active_profile: adjacent_discovery
  profiles:
    balanced:
      direct_experience: 3.25
      transferable_responsibilities: 1.25
      industry: 2.0
      business_model: 1.0
      workplace: 2.0
      language: 1.0
      visa: 0.5
    cv_evidence:
      direct_experience: 5.25
      transferable_responsibilities: 0.75
      industry: 2.0
      business_model: 0.75
      workplace: 1.0
      language: 1.0
      visa: 0.5
    adjacent_discovery:
      direct_experience: 2.5
      transferable_responsibilities: 3.0
      industry: 1.5
      business_model: 1.0
      workplace: 1.5
      language: 1.0
      visa: 0.5
  workplace:
    local_hybrid_or_office: 1.0
    geneva_hybrid_or_office: 1.0
    remote: 0.35
    other: 0.2
  language:
    english_signal: 1.0
    french_signal: 0.8
    unspecified: 0.65
  visa:
    sponsorship_signal: 1.0
    unspecified: 0.5
  recency_bonus:
    within_2_days: 0.5
    within_7_days: 0.2
