target_titles:
  - Product Marketing Manager
  - PMM
  - Go-to-Market Manager
  - GTM Manager
  - Product Marketing Lead
  - Specialiste Marketing Produit
  - Responsable Marketing Produit
  - Marketing Manager

target_industries:
  - insurance
  - energy
  - tech
  - health

locations:
  france:
    country_code: fr
    preferred: [Chamonix, Haute-Savoie, Annecy, Lyon, Paris]
    workplace_models: [hybrid, in-office, remote]
    commute_hubs: [Geneva, Genève]
  switzerland:
    country_code: ch
    preferred: [Geneva, Genève]
    workplace_models: [hybrid, in-office]
    visa_sponsorship_required: true
    visa_sponsorship_signals: [visa sponsorship, work permit sponsorship, sponsorship available, permis de travail, sponsoring visa]
  include_remote: true

language_rules:
  candidate_english: native
  candidate_french: professional
  accepted_posting_languages: [English, French]
  require_english_role_signal: false  # Relaxed so bilingual/French listings aren't blocked

negative_keywords:
  - director
  - vp
  - chief marketing officer
  - cmo
  - intern
  - alternance
  - stage
  - jeune diplome
  - hardware
  - engineering
  - marops
  - marketing operations

notification_email: chey.jobbot@gmail.com

search:
  results_per_query: 40
  pages: 2
  max_age_days: 30
  minimum_fit_score: 3.0  # Lowered slightly to catch more borderline matches

scoring:
  keyword_overlap_max: 6.0
  industry_boost: 2.0
  workplace:
    local_preferred: 3.5      # Heavy boost for Chamonix, Annecy, Geneva
    france_nationwide: 1.5    # Moderate score for rest of France
    remote: 2.0
