notification_email: chey.jobbot@gmail.com
user_name: Cheyguy

search:
  results_per_query: 40
  pages: 2
  max_queries_per_country: 18
  # Keep the API request ceiling fixed while reserving queries for partner/channel roles.
  core_query_slots: 6
  partner_channel_query_slots: 4
  business_model_query_slots: 5
  api_retries: 3
  retry_backoff_seconds: 2
  max_retry_delay_seconds: 30
  max_consecutive_failed_pages: 4
  max_age_days: 30
  # Keep adjacent and transferable matches; show up to five roles in each of three lanes.
  minimum_fit_score: 3.0
  max_email_results_per_lane: 5
  # Log every job dropped by the title filter. Review for a week, then set to false.
  log_rejected_titles: true

# Favor early-to-mid PMM scope while protecting transferable marketing experience.
# Hard screen: principal titles, 5+ years specifically in PMM, explicit pure-B2B
# requirements, and 8+ years overall (so roles requiring up to 7 remain eligible).
# Marketing experience outside PMM remains transferable and is not subject to
# the PMM-specific cap.
seniority_filters:
  screen_out_minimums_at_or_above:
    overall_years: 8
    direct_pmm_years: 5
  direct_pmm_signals:
    - product marketing
    - pmm
    - marketing produit
    - responsable marketing produit
    - chef de produit marketing
  soft_downrank:
    direct_pmm_years_threshold: 5
    direct_pmm_years_penalty: 0.8
    desired_similar_role_years_max: 2
    direct_pmm_years_bonus: 0.5
    similar_role_years_bonus: 0.25
    senior_title_signals: [senior, staff, principal]
    solo_or_build_scope_signals:
      - first PMM
      - only PMM
      - sole PMM
      - first product marketer
      - only product marketer
      - sole product marketer
      - build the PMM function from scratch
      - build the product marketing function from scratch
      - create the PMM function
      - establish the product marketing function
      - one-person PMM team
      - premier PMM
      - première personne en marketing produit
      - seul PMM
      - seule PMM
      - unique PMM
      - construire la fonction marketing produit
      - créer la fonction marketing produit
      - structurer la fonction marketing produit
    solo_scope_penalty: 0.8
    senior_with_solo_scope_additional_penalty: 0.4
    max_penalty: 1.8
    similar_role_signals:
      - similar position
      - similar role
      - comparable position
      - poste similaire
      - fonction similaire
  exclude_explicit_pure_b2b_minimum: true
  exclude_explicit_pure_b2b_requirement: true
  exclude_mandatory_b2b_or_saas_experience: true
  pure_b2b_requirement_signals:
    - must have
    - is a must
    - required
    - requires
    - mandatory
    - essential
    - minimum
    - at least
    - requis
    - exige
    - obligatoire
    - indispensable
    - au moins
  preferred_signals:
    - preferred
    - desirable
    - ideally
    - nice to have
    - would be a plus
    - an advantage
    - souhaité
    - souhaitable
    - apprécié
    - un atout

# Reject postings that require an engineering diploma. A degree phrase counts as
# required unless a preferred signal sits right next to it, or an alternative
# (such as "école de commerce") appears nearby.
degree_filters:
  exclude_explicit_engineering_degree_requirement: true
  default_is_requirement: true
  preferred_window_chars_before: 30
  preferred_window_chars_after: 15
  alternative_window_chars: 60
  engineering_degree_signals:
    - engineering degree
    - engineering diploma
    - degree in engineering
    - technical degree
    - diplôme d'ingénieur
    - diplôme d'ingénieure
    - formation d'ingénieur
    - formation ingénieur
    - ingénieur de formation
    - ingénieure de formation
    - issu d'une école d'ingénieur
    - issue d'une école d'ingénieur
    - école d'ingénieur
    - école d'ingénieurs
    - profil ingénieur
    - bac+5 ingénieur
  preferred_signals:
    - idéalement
    - ideally
    - de préférence
    - preferably
    - souhaité
    - souhaitable
    - apprécié
    - un atout
    - serait un plus
    - est un plus
    - is a plus
    - would be a plus
    - nice to have
    - an advantage
    - desirable
    - preferred
  alternative_signals:
    - école de commerce
    - ou équivalent
    - or equivalent
    - or business
    - ou commerce
    - ou école de commerce

