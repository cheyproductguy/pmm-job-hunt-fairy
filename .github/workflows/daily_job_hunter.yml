name: Daily PMM Job Hunter

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Restore sent-job history
        uses: actions/cache/restore@v4
        with:
          path: .job_history.json
          key: pmm-job-history-${{ github.run_id }}
          restore-keys: pmm-job-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize history if needed
        run: python -c "import json,pathlib; p=pathlib.Path('.job_history.json'); p.write_text(json.dumps({'sent_ids': []}) if not p.exists() else p.read_text(), encoding='utf-8')"

      - name: Search, score, and email fresh matches
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_ALERT_EMAIL: ${{ secrets.JOB_ALERT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Save sent-job history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .job_history.json
          key: pmm-job-history-${{ github.run_id }}
