name: Daily PMM Job Hunter

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore sent-job history
        uses: actions/cache/restore@v4
        with:
          path: .job_history.json
          key: job-history-${{ github.run_id }}
          restore-keys: job-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Search, score, and email fresh matches
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_ALERT_EMAIL: ${{ secrets.JOB_ALERT_EMAIL }}
        run: python main.py

      - name: Save sent-job history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .job_history.json
          key: job-history-${{ github.run_id }}
